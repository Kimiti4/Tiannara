<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tiannara Observatory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0e1a;
      color: #e8ecf4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 1.5rem;
    }

    .splash-logo {
      margin-bottom: 1.5rem;
    }

    .splash-logo svg {
      filter: drop-shadow(0 0 12px rgba(0, 217, 255, 0.3));
    }

    .splash-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #00d9ff;
      letter-spacing: 0.15em;
      margin-bottom: 0.5rem;
    }

    .splash-subtitle {
      font-size: 0.7rem;
      color: #5a6478;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
    }

    .splash-log {
      width: 100%;
      flex: 1;
      background: #111827;
      border: 1px solid rgba(0, 217, 255, 0.12);
      border-radius: 8px;
      padding: 1rem;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      line-height: 1.6;
      color: #8b95a8;
    }

    .splash-log-line {
      white-space: pre-wrap;
      word-break: break-all;
    }

    .splash-log-line.highlight {
      color: #00d9ff;
    }

    .splash-log-line.success {
      color: #00ff9f;
    }

    .splash-log-line.error {
      color: #ff3366;
    }

    .splash-progress {
      width: 100%;
      height: 3px;
      background: #1a2035;
      border-radius: 2px;
      margin-top: 1rem;
      overflow: hidden;
    }

    .splash-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00d9ff, #00ff9f);
      border-radius: 2px;
      width: 0%;
      transition: width 0.5s ease;
      animation: progressPulse 2s ease-in-out infinite;
    }

    @keyframes progressPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .splash-dots {
      display: flex;
      gap: 0.4rem;
      margin-top: 1rem;
    }

    .splash-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00d9ff;
      animation: dotPulse 1.4s ease-in-out infinite;
    }

    .splash-dot:nth-child(2) { animation-delay: 0.2s; }
    .splash-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="splash-logo">
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="#00d9ff" stroke-width="2"/>
        <circle cx="16" cy="16" r="8" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
        <circle cx="16" cy="16" r="3" fill="#00d9ff"/>
        <line x1="16" y1="2" x2="16" y2="8" stroke="#00d9ff" stroke-width="1.5"/>
        <line x1="16" y1="24" x2="16" y2="30" stroke="#00d9ff" stroke-width="1.5"/>
        <line x1="2" y1="16" x2="8" y2="16" stroke="#00d9ff" stroke-width="1.5"/>
        <line x1="24" y1="16" x2="30" y2="16" stroke="#00d9ff" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="splash-title">TIANNARA OBSERVATORY</div>
    <div class="splash-subtitle">Constitutional Planetary Intelligence</div>
    <div class="splash-log" id="bootLog"></div>
    <div class="splash-progress">
      <div class="splash-progress-bar" id="progressBar"></div>
    </div>
    <div class="splash-dots">
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
      <div class="splash-dot"></div>
    </div>
  </div>
    <script>
    const logEl = document.getElementById('bootLog');
    const progressBar = document.getElementById('progressBar');
    let lineCount = 0;
    const stepNames = ['Environment','Logging','Telemetry','Configuration','Redis','NATS','BEAM','PostgreSQL','MSCL','OLEF','HSV','GRCC','CTL','OCM','CIS','AEO','Discovery','Frontend'];

    function addLogLine(msg) {
      var display = msg.replace(/^(info|success|error|warning|highlight):\s*/, '');
      const line = document.createElement('div');
      line.className = 'splash-log-line';
      if (msg.startsWith('success') || msg.includes('Ready') || msg.includes('ready')) {
        line.classList.add('success');
      } else if (msg.startsWith('error') || msg.startsWith('critical') || msg.includes('Failed') || msg.includes('Crash')) {
        line.classList.add('error');
      } else if (msg.startsWith('highlight') || msg.includes('Starting') || msg.includes('Boot')) {
        line.classList.add('highlight');
      } else if (msg.startsWith('warning')) {
        line.classList.add('error');
      }
      line.textContent = display;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
      lineCount++;
      var matched = 0;
      stepNames.forEach(function(s) { if (display.includes('[' + s + ']')) matched++; });
      var extra = Math.min(matched * 2, 10);
      var pct = Math.min(lineCount * 5 + extra, 95);
      progressBar.style.width = pct + '%';
    }

    if (window.tiannara) {
      window.tiannara.onBootLog(addLogLine);
    }
  </script>
</body>
</html>
