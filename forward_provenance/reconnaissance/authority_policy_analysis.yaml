policy_draft_contents (direct read, certification/reconnaissance/knowledge/TIA_PROVENANCE_CERTIFICATION_POLICY.yaml):
  authority:
    principle: "A certificate is an authority-issued binding between a decision and the
      evidence chain it certifies."
    authority_kind: human | mechanism
    requirements:
      - every certificate records authority + authority_kind at issuance
      - mechanism-issued certs valid only where the authority registry explicitly
        delegates to mechanism (never where human judgment is mandated)
      - until M7 single-vs-distributed is resolved, HUMAN RATIFICATION is required for
        any runtime-integrated forward certificate
    prohibitions: self-named meta-authority prohibited (legacy certification_certificate.json
      case excluded from the forward model)
  issuance_conditions:
    all_must_hold: 10 items (unique execution chain; execution_id uniqueness; recomputable
      source identity; recomputable contract identity; environment identity + manifests;
      result+payload_hash bound DERIVED_FROM; metric under metric_manifest and recomputable
      or PARTIALLY REPRODUCIBLE with gap stated; reproducibility class declared; canonical
      serialization version cited; historical firewall passes)
    impossible_cases: cert on unresolvable execution_id; cert on hash-only evidence; cert
      on PARTIAL/ABORTED execution; cert on metric without manifest/corpus
  states_and_transitions: VALID/SUSPENDED/REVOKED/UNVERIFIABLE/SUPERSEDED + rules
    (semantics only until authorized)
  invalidation: deletion/envelope loss; authority revocation; spec supersession; hash
    recomputation mismatch — never auto re-validated; only full re-verification restores
  human_oversight: authority ratification, REVOKE/SUPERSEDE decisions, UNVERIFIABLE
    resolution are human-judgment points; Observatory NEVER issues certificates
  historical_firewall: FORWARD_PROVENANCE_MUST_NOT_CERTIFY_HISTORICAL_UNVERIFIED_EVIDENCE;
    CONTRA-003/RQ-001/RQ-004/RQ-010 preserved unresolved; policy adds no gc_012 verdict
  security: hashes verify bytes; certificate chains carry authority; never conflated
  schema_evolution: envelopes immutable; evolution = new envelope; SUPERSEDED channel
  open_questions_it_does_not_resolve: single vs distributed authority (M7); mechanism-only
    ratification; RQ-010; promotion-gate mechanics

