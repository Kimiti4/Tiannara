    values: [CERTIFIED, BOUNDED, PENDING, BLOCKED]
    rule: Assigned ONLY with sufficient evidence per master.md sections 6-9. Never by code presence alone. Never by documentation alone.
  evidence_classification:
    values: [UNKNOWN]
    meaning: Insufficient evidence to assign a primary operational state.
    rule: UNKNOWN is a separate classification, not a fifth primary state. An unevidenced capability is UNKNOWN, never forced into PENDING.
