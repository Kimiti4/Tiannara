program: TIA_FORENSIC_RECON_ENGINE
move: FORWARD-PROVENANCE-INTEGRATION-CERTIFICATION-GATE
schema_version: "1.0.0"
method: "Adversarial INTEGRATION test design against the forward provenance substrate (TiannaraOS.Provenance) and the runtime systems it would bind. Extends the minimum-model adversarial plan (A-J in TIA_PROVENANCE_ADVERSARIAL_TEST_PLAN) with integration adversaries K-T. Each test states setup, procedure, expected verdict, and current-repository detection status (pre-integration). Tests are DESIGNED, not executed, in this gate."
STATUS: "TEST PLAN COMPLETE (11 integration tests K-T; execution requires a later Council-authorized integration stage)"
base: "TIA_PROVENANCE_ADVERSARIAL_TEST_PLAN (A-J) - K-T are the integration extensions; A-J target the substrate, K-T target substrate x runtime coexistence"
verdicts_vocabulary: "ACCEPT / REJECT / DISTINCT / PARTIAL / UNVERIFIED / UNVERIFIABLE / INVALID / CONTESTED (verification_status vocabulary from the minimum model)"

tests:
  test_K_cross_runtime_id_substitution:
    description: "A forward certificate for execution X is bound to a runtime execution record whose execution_id was minted by a DIFFERENT runtime subsystem for execution Y (prefix collision between forward / Phase-4 / OPC id spaces)."
    setup: "Forward certificate C references execution_id E. Runtime ledger also contains E but it identifies execution Y from Phase-4 RealExecution (exec_<unix>_<unique_integer>), not the forward-observed X."
    procedure: "Resolve E through the Central Uniqueness Registry/mapping; verify the record's identity_hash + producer match the envelope the forward layer observed; compare contract/source/input identities."
    expected: "REJECT (cross-runtime ID substitution - the certificate's execution claim does not resolve to the execution the forward layer observed)"
    current_repository_status: "UNDETECTABLE TODAY - three id generators exist (forward execution.ex:26-30, OPC execution_runtime.ex:51, Phase-4 real_execution.ex:216-218) with NO uniqueness boundary; the collision is latent until integration"
    acceptance: "test_K_cross_runtime_id_substitution returns REJECT"
  test_L_retry_confusion:
    description: "The same logical step is retried N times (crash + restart); the certificate chain must unambiguously cite exactly ONE attempt, and every attempt must carry a DISTINCT execution_id."
    setup: "Execution E fails at attempt 1, retried as E2..EN. Each attempt appends execution_started/execution_ended."
    procedure: "Assert attempt ids are pairwise distinct; assert the certificate references exactly one attempt's chain; attempt to merge outputs across attempts."
    expected: "DISTINCT ATTEMPTS (no id reuse); a certificate that blends waste across attempts is REJECT"
    current_repository_status: "UNDETECTABLE TODAY - no retry attempt model exists in any runtime producer; EventStore events carry no attempt-parent linkage"
    acceptance: "test_L_retry_confusion records N distinct attempt ids and rejects blended-certificates"
  test_M_partial_execution:
    description: "Execution ends without a success terminal event (crash / timeout / cancel); no certificate may issue on the partial trail."
    setup: "Execution_started appended; execution_ended missing or status PARTIAL/ABORTED; partial outputs written."
    procedure: "Run certification gate; require terminal success event + full output manifest before decision_recorded."
    expected: "PARTIAL / NOT CERTIFIABLE (no certificate; partial outputs recorded as-is, never certified)"
    current_repository_status: "PARTIALLY DETECTABLE - Phase-4 ledger records verification status but nothing gates certification against it; forward vocabulary lacks TIMEOUT/CANCELLED/ABORTED (recon: integration_extensions)"
    acceptance: "test_M_partial_execution yields NO certificate and a NOT CERTIFIABLE verdict"
  test_N_metric_drift:
    description: "The same metric name is computed by two different definitions (definition_version / computation_hash differ); the forward layer must record DISTINCT METRIC LINEAGE, never a single shared claim."
    setup: "Metric m computed on corpus C via definition V1 (sum) and V2 (mean). Both recorded with metric_manifest."
    procedure: "Compare metric_manifest (definition_version, computation_hash, aggregation); certify only the manifest-cited computation; detect a claim that swaps V2 output under V1 manifest."
    expected: "DISTINCT METRIC LINEAGE (two named computations, two hashes); any identity-confused claim REJECT"
    current_repository_status: "UNDETECTABLE TODAY - no metric_manifest anywhere; the gc_009/gc_010 auditor-vs-laboratory protocol divergence (1000 vs 100 samples) is the historical instance of this adversary"
    acceptance: "test_N_metric_drift returns DISTINCT and rejects a V2-output-under-V1-manifest claim"
  test_O_source_drift:
    description: "Execution and certification under commit H1; repository code moves to H2; a later observer must not be able to claim the H1 result under H2 source identity."
    setup: "Source identity (repo + commit + tree + manifest hash) recorded at H1; contract drifted; a second claim cites H2 as if it produced the H1 result."
    procedure: "Recompute source identity from recorded bytes; compare the certificate's cited source; resolve drift."
    expected: "REJECT (H2 may not claim H1's certified result; H1 chain remains ACCEPT intact - complements minimum-model test J)"
    current_repository_status: "UNDETECTABLE TODAY - no execution record carries source identity (TIA_CERTIFICATE_TRUTH_INVESTIGATION section C)"
    acceptance: "test_O_source_drift rejects the H2 claim while the H1 certificate chain stays ACCEPT"
  test_P_distributed_orphan:
    description: "A child execution created by a distributed fork whose parent_execution_id does not resolve; it must not be silently attributed to the parent."
    setup: "Fork spawns child C with parent_execution_id P not present in any ledger."
    procedure: "Resolve PARENT_OF edge; attempt auto-attribution of C's outputs to P."
    expected: "UNVERIFIED (C's chain resolves to a missing parent; no attribution; unresolved-edge recorded)"
    current_repository_status: "UNDETECTABLE TODAY - no parent/child execution linkage exists anywhere (recon: distributed_execution finding)"
    acceptance: "test_P_distributed_orphan returns UNVERIFIED for C and never attributes to P"
  test_Q_certificate_replay:
    description: "A certificate issued for execution X is replayed as evidence for a LATER execution Y (same certificate bytes, later context)."
    setup: "Certificate C certifies X (envelopes E_X). Y then cites C as its evidence."
    procedure: "Resolve C's envelope refs to E_X; compare the cited execution with Y."
    expected: "REJECT (certificate replay - C certifies X, not Y)"
    current_repository_status: "UNDETECTABLE TODAY - legacy certificates reference no executions, so replay is indistinguishable from generation (minimum-model test E/D class)"
    acceptance: "test_Q_certificate_replay returns REJECT"
  test_R_provenance_tampering:
    description: "Any envelope/result/corpus byte in the chain is mutated after issuance; payload_hash recomputation must flag the tamper and contest the chain."
    setup: "Issue certificate C on chain L; alter one byte of a result payload (or an envelope field); recompute."
    procedure: "Recompute payload_hash over the recorded canonical bytes; any mismatch marks the node." 
    expected: "REJECT for the tampered node; chain becomes CONTESTED with the failed edge recorded"
    current_repository_status: "DETECTABLE ONLY FOR SELF-HASHING ARTIFACTS TODAY - payload_hash chain verification exists only in the forward substrate; no runtime artifact is chain-verified"
    acceptance: "test_R_provenance_tampering returns REJECT and transitions the chain to CONTESTED"
  test_S_stale_certificate:
    description: "An issued certificate becomes UNVERIFIABLE/INVALID when its own envelope set or authority is revoked/superseded."
    setup: "Certificate C issued under authority A; A is revoked (recorded revocation envelope); a schema_version bump supersedes the canonical spec C cited."
    procedure: "Re-verify C: (a) authority revocation on its issue, (b) spec version validity, (c) freshness of each envelope_ref."
    expected: "UNVERIFIABLE (authority revoked / spec superseded) or INVALID (envelope_ref unresolvable); never silently re-validated"
    current_repository_status: "UNDETECTABLE TODAY - no certificate state machine exists in code (states are semantics in this gate only); legacy certificates are static files"
    acceptance: "test_S_stale_certificate yields UNVERIFIABLE/INVALID for the stale certificate and does not auto-re-validate"
  test_T_historical_contamination:
    description: "An attempt to certify a HISTORICAL unverified record (pre-T0 / legacy unbound result, CONTRA-003 class) using the forward substrate is absolutely rejected."
    setup: "Feed a legacy gc_012-class result (hash-valid, no execution chain, no source/contract identity) into the forward certification path."
    procedure: "Run the historical firewall invariant FORWARD_PROVENANCE_MUST_NOT_CERTIFY_HISTORICAL_UNVERIFIED_EVIDENCE against the candidate evidence."
    expected: "REJECT (historical evidence refused at the boundary; recorded as UNVERIFIED historical debt, never certified, never backfilled)"
    current_repository_status: "ENFORCEABLE ONLY IN DESIGN TODAY - the forward substrate is standalone and will not see legacy records unless an integration wiring sends them; the wiring must include this gate first"
    acceptance: "test_T_historical_contamination returns REJECT and records no certificate, no bundle, no repair"

failure_coverage_map:
  - "cross-runtime id substitution / id prefix collision -> Test K"
  - "retry confusion / attempt blending / id reuse -> Test L"
  - "partial execution / crash-before-terminal / not certifiable -> Test M"
  - "metric drift / definition swap / protocol divergence -> Test N"
  - "source drift / code movement under certified result -> Test O"
  - "distributed orphan / parent missing / mis-attribution -> Test P"
  - "certificate replay / later-execution reuse -> Test Q"
  - "provenance tampering / mutated envelope / contested chain -> Test R"
  - "stale certificate / revoked authority / superseded spec / unverifiable -> Test S"
  - "historical contamination / legacy evidence into forward path / firewall breach -> Test T"
  - "inherited from A-J: wrong execution/result/contract, missing execution, hash-only evidence, duplicate identity, deleted evidence, metric substitution, certificate substitution, contract drift protected"

test_execution_requirements:
  note: "No test above is satisfiable against the standalone substrate alone; each requires at least one runtime-facing integration surface, which is NOT AUTHORIZED in this gate."
  items:
    - "Central Uniqueness Registry (or equivalent mapping) exists so K, L, Q can resolve execution_id unambiguously"
    - "Runtime producers emit execution_started/execution_ended (instrumentation by owner)"
    - "Failure vocabulary extended with TIMEOUT / CANCELLED / ABORTED (M)"
    - "Parent/child linkage for distributed runs (P)"
    - "metric_manifest + persisted corpus (N)"
    - "Certificate state machine semantics enacted (S)"

