program: TIA_FORENSIC_RECON_ENGINE
move: PROVENANCE-CLOSURE-EVIDENCE-ARCHITECTURE-GATE
schema_version: "1.0.0"
method: "Adversarial test design against the TIA_MINIMUM_PROVENANCE_MODEL. Each test states setup, procedure, expected verdict, and current-repository detection status (pre-implementation). Tests are DESIGNED, not executed, in this gate."
STATUS: "TEST PLAN COMPLETE (10 tests; execution requires a later Council-authorized implementation stage)"
test_infrastructure_anchor: "Existing harness: test/tiannara/certification/certification_pipeline_test.exs, test/tiannara/os/governance/integration_test.exs, provenance tests (test/tiannara/forecasting/provenance_test.exs, test/tiannara/evidence/r0_test.exs), fixtures under test/support"
verdicts_vocabulary: "ACCEPT / REJECT / UNVERIFIED / CONTESTED (verification_status vocabulary from the minimum model)"

tests:
  test_A_wrong_execution:
    description: "Attach a valid execution record to the wrong certificate."
    setup: "Two executed campaigns X and Y; certificate C is built for X but references Y's execution envelope"
    procedure: "Resolve every certificate envelope_ref; recompute payload_hash; verify EXECUTED_UNDER chain; compare experiment/source/contract identities in the decision"
    expected: "REJECT (decision references a certificate whose evidence chain resolves to execution Y, not the certified campaign X)"
    current_repository_status: "UNDETECTABLE TODAY - certificates reference no execution at all, so a mis-labeled link cannot be distinguished from absence"
    acceptance: "test_A_wrong_execution returns REJECT in the implementation test suite"
  test_B_wrong_result:
    description: "Attach a valid result produced by another execution to the certificate."
    setup: "Result R from execution Y; certification of execution X consumes R"
    procedure: "Verify result_id -> DERIVED_FROM execution_id matches the certificate's execution chain; hash result payload"
    expected: "REJECT (result lineage mismatches the certified execution)"
    current_repository_status: "UNDETECTABLE TODAY (result artifacts carry no execution reference)"
    acceptance: "test_B_wrong_result returns REJECT"
  test_C_wrong_contract:
    description: "Run under contract V1, certify under V2."
    setup: "Execution recorded with contract_hash(H1); certificate declares contract_hash(H2)"
    procedure: "Compare contract identity in the certificate decision vs the execution envelope"
    expected: "REJECT (contract drift)"
    current_repository_status: "UNDETECTABLE TODAY (contract_hash null everywhere)"
    acceptance: "test_C_wrong_contract returns REJECT"
  test_D_missing_execution:
    description: "Generate a structurally valid certificate with no execution record."
    setup: "Certificate produced with an empty envelope_refs list or an unresolvable execution_id"
    procedure: "Resolve execution_id; require at least one event envelope of type execution_started -> execution_ended with status success and matching result envelopes"
    expected: "UNVERIFIED / REJECTED (no execution evidence chain)"
    current_repository_status: "INDISTINGUISHABLE TODAY - manifest.json already declares campaigns_executed 0 while certificate blocks exist; absence is not flagged"
    acceptance: "test_D_missing_execution returns REJECT or UNVERIFIED"
  test_E_hash_only_evidence:
    description: "Integrity-valid artifact with no execution lineage (the historical case: byte-identical run packets with no certificate reference)."
    setup: "A byte-intact packets/result with recomputable hashes but zero envelope chain to an execution/contract/source"
    procedure: "Run chain validation; note hashes pass but lineage resolves empty"
    expected: "REJECT AS CERTIFICATION EVIDENCE (hash validity is not certification evidence alone - prior gate finding)"
    current_repository_status: "WOULD BE ACCEPTED TODAY IF CERTIFICATE REFERENCED THE PACKET (no lineage gate exists)"
    acceptance: "test_E_hash_only_evidence reports REJECT_AS_CERTIFICATION_EVIDENCE while still recording the artifact as byte-verified"
  test_F_duplicate_identity:
    description: "Two executions produce identical metric values (same metric / different execution)."
    setup: "Two executions with equal final_fitness; assert distinctness"
    procedure: "Compare execution_ids and envelope ids, NOT metric equality"
    expected: "NOT treated as the same execution (identity comparison; metric parity irrelevant)"
    current_repository_status: "PARTIAL - run_ids are byte-distinct in packets; certificates carry no execution id so identity equality is untestable at certification layer"
    acceptance: "test_F_duplicate_identity returns the two executions as distinct regardless of metric equality"
  test_G_deleted_evidence:
    description: "Execution record removed or made unavailable after certification."
    setup: "Certify; then delete/withdraw the execution envelope from the store"
    procedure: "Re-run verification; observe unresolvable execution_id"
    expected: "Certificate becomes UNVERIFIABLE (CONTESTED) unless immutable archival evidence exists (mirrors the historical runs/ deletion -> byte-identical recovery)"
    current_repository_status: "UNDETECTABLE TODAY (deletion indistinguishable from non-existence; prior investigation exposed exactly this in history)"
    acceptance: "test_G_deleted_evidence transitions the certificate to CONTESTED with a recorded unresolved-edge"
  test_H_metric_substitution:
    description: "Same measurement corpus, different metric implementation (the gc_009/gc_010 auditor-vs-laboratory protocol divergence, formalized)."
    setup: "Corpus C persisted; metric definition V1 (1000 samples, joint gates) vs V2 (100 samples, single gates)"
    procedure: "Compare metric_manifest.definition_version + computation_hash between records and against the certified record"
    expected: "REJECT as same-metric claim if the certified record cites a definition that does not match; records differing definitions as distinct computations"
    current_repository_status: "UNDETECTABLE TODAY - auditor protocol already differs from certification protocol in code; no metric manifest records either"
    acceptance: "test_H_metric_substitution detects the definition mismatch and marks the metric claim as PARTIALLY REPRODUCIBLE, not REPRODUCIBLE"
  test_I_certificate_substitution:
    description: "Replace the certificate artifact bytes with another certificates bytes that hash-validates."
    setup: "Certificate C1 replaced by C2 (both structurally valid, C2 has no envelope refs to the certified evidence)"
    procedure: "Verify decision envelope + envelope_refs to evidence; any mismatch in the evidence chain vs the decision claim"
    expected: "REJECT (certificate bytes are self-hash-valid but semantically wrong)"
    current_repository_status: "UNDETECTABLE TODAY - self-hashes validate bytes only; no semantic chain to check (prior gate: hash-valid but semantically wrong artifact)"
    acceptance: "test_I_certificate_substitution returns REJECT for C2 under C1's decision"
  test_J_contract_drift_protected:
    description: "Contract V1 certified earlier remains verifiable after contract drifts to V2 (complements Test C)."
    setup: "Certification recorded with contract_hash(H1); repository contract now H2"
    procedure: "Resolve the certified hash from identity bytes, not from the live contract file"
    expected: "ACCEPT (H1 chain remains intact; live H2 does not affect historical certification)"
    current_repository_status: "N/A TODAY (no contract hashes exist to protect)"
    acceptance: "test_J_contract_drift_protected returns ACCEPT for the H1-certified envelope after drift"

failure_coverage_map:
  - "wrong_execution -> Test A"
  - "wrong_result -> Test B"
  - "wrong_contract -> Test C"
  - "certificate_generated_without_execution -> Test D"
  - "hash-only-evidence / semantically-wrong-but-valid artifact -> Test E"
  - "duplicate_execution_id / collision / same-metric-different-execution -> Test F"
  - "execution_record_deleted / result_record_deleted -> Test G"
  - "wrong_metric_implementation / stale_metric / auditor protocol divergence -> Test H"
  - "certificate_copied_from_another_run / certificate_substitution -> Test I"
  - "contract_drift / stale_contract -> Test C + Test J"
  - "tampered_provenance_record -> payload_hash recomputation across all tests"
  - "orphaned_certificate / orphaned_result / orphaned_execution -> Test D + Test G lineage resolution"

knowledge_changes: "NONE"
implementation: "NONE"
remediation: "NONE"
