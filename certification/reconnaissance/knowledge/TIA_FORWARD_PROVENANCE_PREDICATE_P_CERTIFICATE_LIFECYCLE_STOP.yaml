implementation summary:
  - ONE registered lifecycle authority (tiannara-fp-lifecycle-authority-v1, kind human,
    role lifecycle) is first-writer-wins; competing authorities rejected; unknown or
    unauthorized actors cannot transition. Registry replays idempotently from the
    lifecycle ledger on restart (deep_null_to_nil decode normalization reproduces ETS
    records byte-identically).
  - state machine: VALID <-> SUSPENDED <-> UNVERIFIABLE with the restoration path
    UNVERIFIABLE->SUSPENDED->VALID (restore + evidence_recovered require a fully
    re-verified lineage/bundle chain). Verbs suspend/restore/mark_unverifiable/
    evidence_recovered are implemented; revoke/supersede are FORBIDDEN (closed
    P-CERTIFICATE-REVOCATION / P-CERTIFICATE-SUPERSESSION predicates cited); every other
    verb is UNDEFINED. All failures return {:error, reason, context} and leave state
    untouched. State space is closed to VALID | SUSPENDED | UNVERIFIABLE | replayed;
    REVOKED/SUPERSEDED exist only as advertised policy-pinned terminal states with NO
    implemented path to reach them.
  - every transition is an envelope-bound canon-v1 sentence (previous_state -> next_state,
    sequence, recomputed payload_hash, request_signature) appended to the lifecycle
    ledger; current_state is a virtual seq-0 VALID while unmaterialized and derives from
    the immutable issuance record otherwise. Identical requests replay (matched by
    request_signature, never duplicated); distinct conflicting requests fail closed with
    invalid_source_state and preserve state/history.
  - persistence is atomic: a ledger-append failure rolls the ETS registry back fully
    (transition record deleted, prior state restored, issuance record untouched, zero
    partial traces). Transitions are serialized per certificate via a lock key.
  - the issuance record and certificate identity stay byte-identical across every
    transition; certificate_id is immutable and never re-derived.
  - M7 boundary held: no revocation function, no supersede/issue_successor function,
    no distribute/sync/gossip/replicate functions exist anywhere; there is NO
    distributed lifecycle state. A distributed-verification/issuance grant REMAINS
    an explicit closure responsibility of the verified certificate authority.

