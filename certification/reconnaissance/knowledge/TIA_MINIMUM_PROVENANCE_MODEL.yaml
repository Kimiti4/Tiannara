program: TIA_FORENSIC_RECON_ENGINE
move: PROVENANCE-CLOSURE-EVIDENCE-ARCHITECTURE-GATE
schema_version: "1.0.0"
method: "Design synthesis grounded in TIA_PROVENANCE_ARCHITECTURE_RECONNAISSANCE findings. Every field justified by: purpose, necessity (C=critical / S=supporting / O=optional-conditional), verification_method, failure_prevented. Design only - NOT implemented in this gate."
STATUS: "DESIGN COMPLETE (minimum internally coherent model; implementation deferred to Council authorization)"

design_principles:
  - "Minimal by evidence: only fields that map to an observed failure mode or an unmet audit question are included"
  - "Identity over inference: no relationship may be reconstructed from filenames, timestamps, directory placement, naming, value-matching, or probabilistic similarity"
  - "Immutable envelope per event: an envelope is created once, hash-bound at creation, and never mutated (new envelope for change)"
  - "Explicit absent state: unknown identity is recorded as unknown, never fabricated (mirrors Provenance.unknown philosophy)"
  - "Reuse, do not replace: the design extends the existing Tiannara.Evidence.Provenance schema and the real_execution ledger; it does not spin up a parallel platform"
  - "Certificates reference envelopes, not values: certificate claims cite envelope_ids + payload hashes so auditors follow the chain instead of trusting inline numbers"

provenance_envelope:
  description: "One immutable ProvenanceRecord per verifiable event (execution start, execution end, result production, metric computation, certification decision)."
  fields:
    - field: "schema_version"
      type: "string"
      purpose: "Pin the record grammar so future evolution cannot silently break parsers"
      necessity: "C"
      verification_method: "schema registry version compared on parse"
      failure_prevented: "misinterpreted/wrong-grammar record; unversioned evolution"
    - field: "envelope_id"
      type: "uuid"
      purpose: "Unambiguous immutable identifier of this envelope; referenced by parents, results, metrics, certificates"
      necessity: "C"
      verification_method: "format check + uniqueness index on the envelope store"
      failure_prevented: "duplicate identity; orphan linkage"
    - field: "event_type"
      type: "enum(execution_started, execution_ended, result_produced, metric_computed, decision_recorded)"
      purpose: "State which provenance step this envelope captures"
      necessity: "C"
      verification_method: "dictionary validation"
      failure_prevented: "conflating steps in the chain"
    - field: "parent_envelope_id"
      type: "uuid | nil"
      purpose: "Link an envelope to the preceding event (derivation chain root)"
      necessity: "S (nil allowed for chain roots)"
      verification_method: "referential integrity check over the store"
      failure_prevented: "orphaned events; fabricated chains; deleted-middle evidence"
    - field: "producer"
      type: "module identity + generator version"
      purpose: "Identify the producing component and its version for attribution and drift detection"
      necessity: "S"
      verification_method: "producer registry comparing module+version against the record"
      failure_prevented: "stale producer; unversioned metric/result generation"
    - field: "produced_at / captured_at"
      type: "iso8601 timestamp (wall clock monkey-agnostic; monotonic optional)"
      purpose: "Event ordering and audit timeline; NEVER a provenance substitute"
      necessity: "S"
      verification_method: "clock sanity checks; never used to infer identity"
      failure_prevented: "misordering; timestamp-only provenance claims"
    - field: "bindings"
      type: "map of identity_ref -> {identity_kind, identity_hash}"
      purpose: "Secure the identities this event depends on (see identity objects below)"
      necessity: "C"
      verification_method: "each identity_hash recomputed from referenced identity bytes"
      failure_prevented: "wrong source; wrong contract; wrong input set"
    - field: "verification_status"
      type: "enum(verified, unverified, contested, failed)"
      purpose: "Track whether downstream verification has ratified this envelope"
      necessity: "S"
      verification_method: "transitioned only by verification actors (incl. independent auditor)"
      failure_prevented: "self-rated success presented as audited success"
    - field: "payload_hash"
      type: "sha256 over canonical serialization of the envelope body + bound payload byte range"
      purpose: "Byte-integrity anchor distinguishing a live record from a tampered one"
      necessity: "C"
      verification_method: "byte-exact canonical serialization recomputation (defined spec, not ad-hoc)"
      failure_prevented: "tampered_provenance_record; silent mutation"
    - field: "canonical_serialization_spec"
      type: "string (spec id/version)"
      purpose: "Name the exact serialization rules (field order, line endings, whitespace, charset) that payload_hash uses"
      necessity: "C"
      verification_method: "recomputation under the named spec"
      failure_prevented: "hash mismatch / phantoms caused by canonically undefined hashing (the governance-cert case)"

identity_objects:
  source_identity:
    - field: "repository"
      purpose: "Name the source repo for the exact code that ran"
      necessity: "C"
      verification_method: "recorded at execution start from runtime-provided env"
      failure_prevented: "wrong_source_commit attribution"
    - field: "commit"
      purpose: "Exact commit that defines the executed source"
      necessity: "C"
      verification_method: "git rev-parse HEAD at event time; hash stored"
      failure_prevented: "wrong_source_commit; drift attribution"
    - field: "tree"
      purpose: "Tree identity at execution time (source of truth for code bytes)"
      necessity: "C"
      verification_method: "git rev-parse HEAD^{tree} at event time"
      failure_prevented: "wrong_source_commit"
    - field: "dirty_state_fingerprint"
      purpose: "Represent uncommitted working-tree drift (a hash over tracked-file modifications) so 'not exactly this commit' is still bound"
      necessity: "O (required when dirty execution is authorized; otherwise nil)"
      verification_method: "recomputed working-tree fingerprint"
      failure_prevented: "T0-style snapshot ambiguity (code uncommitted for months)"
    - field: "source_manifest_hash"
      purpose: "Hash over explicit source file list actually loaded"
      necessity: "S"
      verification_method: "manifest recomputation"
      failure_prevented: "source subset mismatch"
  contract_identity:
    - field: "contract_hash"
      purpose: "Immutable hash of the contract YAML/schema bytes that governed the step"
      necessity: "C"
      verification_method: "byte hash of the referenced contract object"
      failure_prevented: "wrong_contract; contract_drift (V1 run certified under V2)"
    - field: "contract_version"
      purpose: "Human-meaningful version string pinned alongside the hash"
      necessity: "S"
      verification_method: "version field inside contract (contract files currently lack it)"
      failure_prevented: "stale_contract attribution"
    - field: "parameter_set"
      purpose: "Configuration/parameter values the contract posits for the step"
      necessity: "C"
      verification_method: "parameter manifest bytes recorded and hashed"
      failure_prevented: "wrong_configuration; replica of config_hash prefix ambiguity"
    - field: "test_specification_hash"
      purpose: "Hash of the test/experiment definition used (recipes, fixtures, thresholds)"
      necessity: "C"
      verification_method: "recompute from the definition bytes"
      failure_prevented: "wrong_test_suite; threshold substitution in metrics"
  experiment_definition_identity:
    - field: "definition_id"
      purpose: "Identifier of the experiment/recipe definition (pairing with campaign)" 
      necessity: "S"
      verification_method: "definition registry lookup"
      failure_prevented: "orphaned campaigns"
    - field: "recipe_hash"
      purpose: "Byte-hash of the full experiment definition"
      necessity: "C"
      verification_method: "recompute"
      failure_prevented: "definition drift between run and certification"
  execution_identity:
    - field: "execution_id"
      purpose: "Primary execution identifier (reuses existing exec_/prefix forms but adds uniqueness enforcement)"
      necessity: "C"
      verification_method: "uniqueness index on execution store"
      failure_prevented: "duplicate_execution_id"
    - field: "run_id / campaign_id / parent_execution_id"
      purpose: "Group the execution into run/campaign contexts and lineage"
      necessity: "S"
      verification_method: "referential integrity"
      failure_prevented: "orphaned_execution; collapsed campaign attribution"
    - field: "seed"
      purpose: "Determinism anchor for stochastic steps"
      necessity: "C (for stochastic executions) / O (for deterministic)"
      verification_method: "seed recorded pre-run; replay matches trajectory"
      failure_prevented: "wrong_seed; unreproducible metrics"
    - field: "start_time / end_time"
      purpose: "Duration and ordering"
      necessity: "S"
      verification_method: "clock sanity and monotonic checks"
      failure_prevented: "no dedicated clock misuse"
    - field: "runtime_version + environment_identity (backend, os, otp, elixir, deps_lock_hash)"
      purpose: "Pin the exact environment (deps_lock_hash is the load-bearing part)"
      necessity: "C (deps_lock_hash) / S (others)"
      verification_method: "compare recorded runtime env to current env at audit"
      failure_prevented: "environment drift; runtime-version claim without binding"
    - field: "input_manifest"
      purpose: "Record every input artifact (path, role, hash) the execution consumed"
      necessity: "C"
      verification_method: "manifest entries hash-verified against copied inputs"
      failure_prevented: "wrong_configuration; wrong_seed; hidden input substitution"
    - field: "output_manifest"
      purpose: "Record every output artifact the execution produced"
      necessity: "C"
      verification_method: "output hashes recomputed at certification time"
      failure_prevented: "wrong_result_file; result_record_deleted undetectable"
    - field: "status + failure_information"
      purpose: "Explicit success/failure/incomplete + structured failure"
      necessity: "C"
      verification_method: "status transitioned by observed runtime outcome"
      failure_prevented: "failed_execution_reported_as_success; partial_execution"
  result_identity:
    - field: "result_id"
      purpose: "Immutable identifier of the produced result artifact"
      necessity: "C"
      verification_method: "result store lookup + payload hash"
      failure_prevented: "wrong_result; result swapped between executions"
    - field: "derived_from (execution_id + output_manifest hash)"
      purpose: "Explicit RESULT -> EXECUTION edge (the currently missing link)"
      necessity: "C"
      verification_method: "resolution of the referenced execution envelope"
      failure_prevented: "orphaned_result; RESULT -> EXECUTION NOT ESTABLISHED"
    - field: "payload_hash"
      purpose: "Hash of the result bytes"
      necessity: "C"
      verification_method: "byte recomputation"
      failure_prevented: "result tampering"
  metric_manifest:
    - field: "metric_name + metric_definition_version"
      purpose: "Name and pin the exact metric computation"
      necessity: "C"
      verification_method: "definition registry"
      failure_prevented: "wrong_metric_implementation; stale_metric; auditor/certification protocol divergence (gc_009/gc_010 1000-vs-100 samples)"
    - field: "computation_hash"
      purpose: "Hash of the metric calculation code"
      necessity: "C"
      verification_method: "recompute vs current code hash"
      failure_prevented: "wrong_metric_implementation"
    - field: "input_field_list"
      purpose: "Exact fields consumed by the metric"
      necessity: "S"
      verification_method: "static inspection"
      failure_prevented: "input-field substitution"
    - field: "aggregation_method / rounding / normalization / seed_dependence"
      purpose: "Full derivation spec so the metric is reconstructable, not just present"
      necessity: "C"
      verification_method: "independent recomputation from the persisted measurement corpus"
      failure_prevented: "metric value present but not reproducible"
    - field: "measurement_corpus_ref (envelope_id of the persisted measurements)"
      purpose: "Point at the immutable measurement corpus the metric consumed (currently ephemeral)"
      necessity: "C"
      verification_method: "corpus hash verified; metric recomputed from it"
      failure_prevented: "measurements lost; HOLD of independent re-derivation"
    - field: "recomputed_at + recomputed_by"
      purpose: "Audit trail of independent auditor re-derivation"
      necessity: "S"
      verification_method: "auditor envelope chain"
      failure_prevented: "RATE self-asserted confidence (0.99/0.98 constants) presented as measured"
  certificate_decision:
    - field: "certificate_id"
      purpose: "Reuse existing certificate ids under uniqueness enforcement"
      necessity: "C"
      verification_method: "identity registry"
      failure_prevented: "duplicate certificate identity"
    - field: "decision + reason + issued_at"
      purpose: "The certification verdict and rationale"
      necessity: "C"
      verification_method: "decision envelope review"
      failure_prevented: "unanchored self-asserted verdicts"
    - field: "envelope_refs (referenced evidence envelope_ids + payload hashes)"
      purpose: "THE contractual link: certificate cites the exact evidence envelopes it certifies"
      necessity: "C"
      verification_method: "resolve each envelope; verify its payload_hash; verify chain to execution"
      failure_prevented: "certificate_copied_from_another_run; certificate_generated_without_execution; hash-valid-but-wrong-artifact"
    - field: "authority + authority_kind (human / mechanism)"
      purpose: "Bind the decision to the issuing authority and its kind for HUMAN OVERSIGHT accounting"
      necessity: "C"
      verification_method: "authority registry (human identity where oversight is mandatory)"
      failure_prevented: "self-named meta-authority (certification_certificate case); audit attribution gaps"

provenance_graph:
  description: "A DAG of enabled envelopes. Nodes are envelopes; edges are typed relations carrying immutable identifiers."
  edge_types:
    - "DERIVED_FROM (result -> execution)"
    - "EXECUTED_UNDER (execution -> source/contract/experiment definition)"
    - "PRODUCED (execution -> output, metric -> result)"
    - "INCORPORATES (metric -> measurement corpus, certificate -> envelope)"
    - "CERTIFIES (certificate -> evidence envelopes)"
    - "VERIFIES (auditor -> envelope)"
    - "PARENT_OF (execution -> parent_execution_id)"
  edge_attributes:
    - "immutable_identifier: edge_id"
    - "relationship_type: enum above"
    - "creation_event: envelope_id of the creating envelope"
    - "producer: module + version"
    - "verification_status: enum(verified, unverified, contested, failed)"
  supported_operations:
    - "forward traversal: certificate -> envelopes -> execution -> identity objects"
    - "backward traversal: execution -> results -> metrics -> certificates"
    - "independent audit: rebind to identity bytes and recompute payload hashes at every node"
    - "lineage reconstruction from a single execution_id"
    - "failed-edge detection: any node whose incoming edge identifiers do not resolve, or whose payload_hash fails, marks the chain CONTESTED"

contra_003_discrimination:
  description: "How the model will DISCRIMINATE (not reconcile by interpretation) the four candidate explanations for CONTRA-003."
  cases:
    - "same_execution_different_representation: both records share execution_id/result_id and differ in payload rendering -> explainable, not a contradiction"
    - "different_executions: values differ and execution_ids differ -> distinct facts, no contradiction"
    - "different_metric_calculations: metric_manifest differs (protocol/version) across records -> calculation divergence, testable"
    - "historical_artifact_inconsistency: an envelope/identity is missing or unwritable -> unresolved provenance debt recorded as UNKNOWN, never repaired silently"
  required_evidence: "a preserved measurement corpus + metric_manifest for each of the three records, plus source/contract/execution identity for gc_012 - none of which exists today (see Artifact 1 evidence_gaps)"

knowledge_changes: "NONE - this is design; no ledger item changed"
implementation: "NONE"
remediation: "NONE"
certificate_regeneration: "NONE"
experiment_execution: "NONE"
commits: "NONE"
pushes: "NONE"
T0_modified: "NO"