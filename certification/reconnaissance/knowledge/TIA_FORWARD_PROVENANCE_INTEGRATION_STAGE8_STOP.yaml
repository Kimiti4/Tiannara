## Certificate Identity (designed)
- certificate_id := sha256hex(canonical(%{"candidate_id_spec" => <spec>, "spine" => <ordered
  evidence edges>})) — exactly the Stage-6 bridge candidate identity reused as the identity
  basis (design d1). Replay-identical, evidence-recomputable, spec-pinned; NO uuid /
  utc_now / random bytes in identity. Identity vs decision vs authority-header are separate
  fields (policy security: hashes vs authority never conflated).
- The three existing issuer APIs' non-deterministic identity (root utc_now verdict structs,
  runtime strong_rand_bytes ids, forward Certificate.issue "cert_"+uuid) are documented as
  the NON-model, NOT adopted. Supersession stays a lifecycle property, never an identity
  rewrite.

## Issuance (designed, NOT enacted)
- A future realization MAY issue only via an authority-REGISTERED issuer, when EVERY policy
  all_must_hold condition (1..10) holds and NOT ONE impossible_case is present.
- All 14 policy issuance conditions are mapped onto bridge mechanisms as the fail-closed
  evaluation baseline (PC-01..13 + A01..A12 closure; authorized_issuance? remains constant
  false in code). The design does NOT open a single A-predicate; opening requires per-
  predicate Council authorization events that DO NOT exist (design d3/d4).
- Design dependencies recorded (absent today): canonical-serialization spec, authority
  registry, issued-id ledger/lifecycle store, M7 disposition / human-ratification channel.

## Lifecycle / Revocation / Supersession (designed, NOT enacted)
- States VALID / SUSPENDED / REVOKED / UNVERIFIABLE / SUPERSEDED with policy transition
  rules; every transition is an ENVELOPE-BOUND DECISION RECORD (policy wording: revocation
  is itself an envelope); revocation irreversible for an id; supersession via successor
  issuance, original never rewritten.
- Bridge lifecycle_table/0 is the reference vocabulary; transition/3 stays SAFE-BLOCKED;
  the revoked-contrast case (Stage-6 §17 c.2) is now DESIGNABLE but still absent by policy.
- Durability (issued-id ledger, lifecycle store, revocation registry) is a future
  realization item (issuance_design design_dependencies), NOT created in Stage 8.

## Authority Boundary / Ownership (designed, carried)
- Provenance side (substrate + bridge) is unchanged; authority side concepts designed only
  (registry, accepted policy now recorded, M7 disposition missing, ratification channel).
- Seam: a certificate crosses only as a validated decision envelope (certificate_id +
  decision + authority_header + policy_ref + evidence bindings); authority_header must
  resolve against a registry. No crossing is designed before registry + M7 disposition.
- Ownership matrix (Stage 7) carried unchanged; the only delta is policy acceptance now
  being recorded (legal-status change, not a capability change).
- Ratification points: rp1 policy acceptance RECORDED; rp2 M7 disposition REQUIRED AND
  ABSENT; rp3 authority-predicate opening REQUIRED PER PREDICATE AND ABSENT.

