allowed_surface:
  - lifecycle state machine over the EXACT policy-pinned states
    VALID | SUSPENDED | REVOKED | UNVERIFIABLE | SUPERSEDED (modeled for schema
    completeness ONLY; no invented states, no renames, no collapsing)
  - authorized transitions built from the Stage-8 lifecycle design:
      VALID->SUSPENDED                  (verb suspend)
      SUSPENDED->VALID                  (verb restore; full chain re-verification required)
      {VALID,SUSPENDED}->UNVERIFIABLE   (verb mark_unverifiable)
      UNVERIFIABLE->SUSPENDED           (verb evidence_recovered; human kind only
                                         per policy human_oversight (c))
  - restoration path UNVERIFIABLE->SUSPENDED->VALID; REVOKED/SUPERSEDED are terminal
    and represented only contractually (no outgoing transitions, no activation)
  - every transition is an envelope-bound DECISION RECORD written atomically to the
    lifecycle's own append-only canon-v1 JSONL ledger (single sentence per transition,
    full registry rollback on persistence failure); certificate_id, previous_state,
    next_state, decision, authority, policy ref, transition evidence, ordering/
    provenance linkage; no prior transition is ever overwritten; history reconstructable
  - single first-writer-wins lifecycle authority (tiannara-fp-lifecycle-authority-v1,
    default kind human; per-transition kind policy enforced human|mechanism;
    evidence_recovered requires human ONLY); no election/rotation/competing authorities
  - idempotent identical-transition replay; conflicting/out-of-order transitions fail
    closed and preserve state; per-certificate locking prevents concurrent double-apply
  - fail-closed input validation: malformed requests, wrong lifecycle_spec, unknown/
    forbidden verbs, missing/invalid authority, policy mismatch, missing evidence,
    missing restoration chain, unknown certificate_id, invalid issuance state
  - nothing else: NO revocation, NO supersession, NO successor issuance, NO distributed
    verification/distributed issuance, NO authority rotation, NO network interfaces,
    NO production activation beyond the predicate's own ledger

