    evidence_recovered, full restoration path trace); forbidden edges (VALID->REVOKED,
    VALID->SUPERSEDED, self-loops, UNVERIFIABLE->VALID direct jump) fail closed;
    undefined verbs (activate/expire/rotate_authority/garbage) fail closed;
    malformed request / wrong lifecycle_spec; missing-or-malformed authority before and
    after registration; unauthorized authority; kind mismatch; kind denied
    (mechanism cannot resolve UNVERIFIABLE); policy mismatch; missing transition
    evidence; missing restoration chain / mismatched bundle_id not re-verified;
    unregistered certificate_id; identical-transition replay never duplicated;
    conflicting transition invalid_source_state; exactly-one-wins concurrent competing
    transitions; lock held while another transition is in flight (no partial state);
    persistence failure fails closed with full rollback; atomicity (zero trace after
    failure, issuance record byte-identical); issuance record immutable across all
    transitions; certificate_id immutable and never re-derived; restart replays the
    ledger idempotently; ledger sentences canon-v1 canonical; envelopes recompute
    payload_hash; NO revocation behavior anywhere (no revoke function, verb forever
    forbidden); NO supersession behavior (no successor ever created); NO distributed
