## Stage 1 Scope: Identity Authority
PURPOSE: exactly one canonical execution identity authority. Every execution id
that enters the forward provenance universe — whatever its producing runtime —
must be minted or claimed through ONE registry so that an execution id names one
and only one execution ACROSS producers. No graph node may join two executions
on an id that two producers both consider theirs.

IN SCOPE:
- new module TiannaraOS.Provenance.IdentityAuthority (forward_provenance, zero-dep)
- authority-controlled minting preserving the forward id format
  exec_<millis_epoch>_<uuid13>
- external-id claim path (id_format detection: forward_exec_v1, phase4_exec_v1,
  opc_integer, other); first-writer-wins; duplicate claim = collision => reject
  fail-closed from Execution.build
- ETS-backed registry (authoritative) + append-only JSONL ledger (audit)
- resolve/export/registered interfaces for the Stage 2 Runtime Contract
- Execution.build default mint routed through the authority; explicit
  :execution_id routed through claim
- Stage 1 tests (mint uniqueness, collision rejection, cross-producer duplicate,
  ledger replay, Execution integration)

OUT OF SCOPE (later stages):
- Stage 2: Provenance Runtime Contract (opaque id acceptance, resolver binding)
- Stage 3: Runtime Instrumentation (edits to lib/tiannara/phase4/real_execution.ex
  and OPC execution_runtime.ex claiming ids through this authority)
- Stage 6: Certificate Authority
- main app: NO path dependency added in Stage 1 (deferred to Stage 2/3);
  forward_provenance remains zero-dep

