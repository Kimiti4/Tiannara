- FAILURE VOCABULARY (test M): terminal states now
  completed|failed|partial|timed_out|cancelled|aborted|unknown; one-to-one
  verdicts SUCCESS/FAILURE/PARTIAL/TIMEOUT/CANCELLED/ABORTED/UNKNOWN.
  ONLY completed is certifiable; every other terminal - including UNKNOWN - is
  NOT CERTIFIABLE and is never silently upgraded (a late "completed" on a closed
  execution is a CLOSED ATTEMPT).
