  recorded verbatim; PARENT_OF edge created ONLY when the parent resolves in the
  identity authority. Unresolvable parent -> UNVERIFIED, NEVER auto-attributed
  (no fabricated/guessed/silent linkage). No declared parent -> ROOT execution,
  not an orphan.
- DISTRIBUTED DURABILITY: IdentityAuthority.restart/1 (node reboot) replays the
  shared ledger; a parent minted on node A resolves on node B after replay.
- LIFECYCLE: still caller-owned/PURE; portable across processes (holder-agnostic).
