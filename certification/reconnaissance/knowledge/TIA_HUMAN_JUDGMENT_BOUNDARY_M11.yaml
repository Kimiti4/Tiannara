principle: Tiannara augments human intelligence rather than replacing human judgment
boundaries:
- pair: recommendation vs decision
  human_governed_side: decision
  basis: D3 adapter contract (recommendation != authorization, verified in T0 content); Council five-state decision struct
  automation_ceiling: Systems may recommend with stated confidence; decisions with downstream effects require human or Council authorization evidence
- pair: evidence vs authority
  boundary: Evidence supports; authority decides. No evidence artifact in this program authorizes action by itself (including this file).
  basis: Program-wide separation of evidence collection from authorization gates
  automation_ceiling: Automated evidence collection permitted under read-only contracts; authorization transitions require explicit Council signals
- pair: prediction vs action
  boundary: Forecasts and predictions do not self-execute. Execution requires a separately authorized execution path (none evidenced as authorized in T0 beyond registered-but-unexecuted interfaces).
  basis: Forecasting modules analytical-only per R7 record; orchestrator submit/get/cancel interfaces unevaluated for execution semantics
  automation_ceiling: Prediction pipelines may run observably; action pipelines require per-action authorization evidence
- pair: automation vs governance
  boundary: Governance mechanisms (Council supervision, authorization structs, provenance gates) constrain automation; automation may not modify governance (constitutional prohibition transcribed from master.md as VISION_SOURCE, not as measured enforcement)
  basis: master.md constitutional prohibitions (vision); Council supervisor + authorization struct presence (T0)
  automation_ceiling: No self-modification of governance, certification, evidence history, or authority (prohibited unless explicitly governed)
