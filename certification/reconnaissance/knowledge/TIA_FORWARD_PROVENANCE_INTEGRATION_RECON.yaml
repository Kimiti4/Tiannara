program: TIA_FORENSIC_RECON_ENGINE
move: FORWARD-PROVENANCE-INTEGRATION-CERTIFICATION-GATE
schema_version: "1.0.0"
method: "Read-only integration reconnaissance. Grounds the standalone forward provenance implementation (forward_provenance/, namespace TiannaraOS.Provenance, forwards-only, zero-dependency) against the canonical architecture (TIA_CANONICAL_ARCHITECTURE_M7), the runtime identity/execution subsystems, observability, the governance/certification stack, and the knowledge promotion pipeline. Validates the proposed integration-boundary diagram against canonical sources. No implementation, no test execution, no commits, no pushes."
STATUS: "RECON COMPLETE (integration is DESIGNED and GATED, not implemented; see STOP report)"

integration_boundary:
  classification: PROVENANCE IS CROSS-CUTTING EPISTEMIC INFRASTRUCTURE - not an autonomous subsystem. It owns no campaign outcome, no runtime resource, and no result value; it binds evidence to executions immutably and forwards-only.
  boundary_principles:
    - "FORWARD ONLY: envelopes are created once, hash-bound at creation, never mutated; the substrate certifies only evidence it observed at event time"
    - "OBSERVES, NEVER OWNS: execution, result, metric, and certificate objects continue to be owned by their producing subsystems; the provenance layer binds what exists rather than fabricating what should"
    - "IDENTITY OVER INFERENCE: no relationship reconstructed from filenames, timestamps, directory placement, or value matching"
    - "FAIL CLOSED EPISTEMICALLY: unknowns are recorded as UNKNOWN, never fabricated"
  conceptual_basis:
    - "The subsystem is the generalization of the existing provenance gate Tiannara.Evidence.Provenance.acceptable_as_evidence?/1 (T0: accepts only :real_execution + id or :imported_evidence + source; rejects :simulation). The forward substrate extends the same philosophy to full envelopes + graph + certificates for FUTURE evidence only."
  diagram_validation:
    verdict: ACCEPTED WITH AMENDMENTS
    reasoning: "The proposed diagram (TiannaraOS.Provenance as an observation/serialization layer between runtime producers {execution, result, metric, certificate} and consumers {certification, observability, knowledge promotion, audit}) is consistent with the canonical architecture: provenance must NOT be added to the 21-capability ownership table as a domain owner, because it is a cross-cutting layer. Amendments required before any implementation: (1) identity reconciliation, not replacement - the three runtime execution_id generators must route through one uniqueness boundary, (2) the layer must remain forward-only and never emit historical certificates, (3) subsystem owners emit; the provenance layer never calls into producers to force behavior."
    unresolved: "None identified that blocks the DESIGN; the open decision 'certification single authority vs distributed model' (M7) is unresolved and must be resolved BEFORE the forward certificate authority is wired to runtime."

