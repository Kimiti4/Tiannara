## Stage 5 Status
- STATUS: COMPLETE
- SCOPE: EXACTLY the Council-authorized gate item 15 (metric lineage): the
  metric lineage vertex that binds RESULT -> METRIC -> VALUE under the
  completed execution. Contract-level pre-integration only, inside
  forward_provenance/ (the authoring area). NOT a cleanup pass; certificate
  authority / state untouched (Stage 6, deferred); full K-T adversarial
  integration deferred to Stage 7 as binding; no historical provenance claims.
- NEW MODULE: TiannaraOS.Provenance.MetricLineage — a PURE derivation contract
  plus an INDEPENDENT verifier (verify_lineage). It reuses the Stage-1/2/3/4
  substrate (Identity.object_id, Canon.sha256, RuntimeContract envelopes,
  Producer lifecycle, IdentityAuthority, Metric.mean_stddev) WITHOUT modifying
  any of them.
- CHAIN DERIVED PER LINEAGE: SOURCE -> CONTRACT -> EXECUTION -> RESULT -> METRIC:
  exec_id  = immutable Producer identifier (authority-minted, unique per attempt)
  source_id / contract_id = Identity.object_id of the declared source / contract
  result_id = sha256 of (exec_id, attempt, status, payload.canon, result kind)
  metric_id = Identity.object_id{kind: "metric", fields: {definition_id,
              result_id, result_status, value}}
  lineage_id = sha256 of the ordered identity spine (root, edges, result_id,
              metric_id, value, lineage version)
- DETERMINISM: identical inputs (execution + definition + payload + corpus)
  derive the SAME result_id, metric_id, value, and lineage_id. A different
  attempt (attempt: 2) yields DISTINCT ids. derive/1 is PURE and REPLAYABLE.
- VERIFY: verdict ACCEPT only when every check passes and certifiable? true
  (execution terminal == completed). REJECT = semantic inconsistency (reason
  attached); UNVERIFIED = packaged/identity boundary cannot be proven intact
  (e.g. bundle manifest hash mismatch, unresolved parent).
- DISTINCT REASONS (never collapsed): value_mismatch, definition_mismatch,
  source_mismatch, contract_mismatch, execution_mismatch, status_mismatch,
  orphan_lineage (metric claims a result_id the result does not carry),
  parent_resolution (declared parent does not resolve), missing_execution
  (execution not minted). Independent recompute of value and definition is
  checked against the claimed identity, so a redacted/forged in-memory claim is
  semantically REJECTED even before bundle packaging.
- BUNDLE PROTOCOL: export_bundle writes to_full_envelope/2 envelopes
  (execution_started, execution_ended, result_produced), identity_objects/
  (source, contract, environment, execution), graph/provenance_graph.json
  (lineage_id + edges only), results/result.bytes, measurements/ (corpus),
  metrics/ (computed value + identity), meta/bundle_manifest.json (sha256 of
  every file). NO certificates (Stage 6). verify_bundle checks every manifest
  hash; uncoordinated tamper -> UNVERIFIED; coordinated tamper (attacker
  recomputes the manifest) is still semantically REJECTED (exactly as
  in-memory redaction). Determinism preserved byte for byte.
- STAGE-4 CARRYOVER APPLIES: only completed terminal is certifiable
  (M8 matrix: failed/partial/timed_out/cancelled/aborted/unknown all
  NOT CERTIFIABLE); an orphan lineage (unresolved declared parent) verifies
  UNVERIFIED with the parent_resolution reason; unknown/unregistered execution
  -> {:error, :missing_execution, ctx} at derive, never fabricated.

