  title: Contradictions discovered
  items:
    - "E1 (new, extends CONTRA-003): THREE records now disagree on gc_012 (certificate 1/1 + 0.8041/0.1042; result 7/2 + 0.8035/0.0746; governance 7/2 19:47 + 0.7864/0.1068). Prior record showed two; the governance certificate adds a third variant. Status: CONFIRMED CONTRADICTION (deepened, still unresolved)."
    - "E2 (new): Governance certificate self-hash mismatch (recomputed 0b1a6ab6 vs stored 409dbc2a). Alternatives: canonical-subset hash (unevidenced — no canonicalization spec found), stale pre-edit hash (unevidenced), or broken binding (unrefuted). Status: recorded as binding-level provenance break with alternatives listed; content verdict stays UNKNOWN."
    - "E3 (new): certificate.json carries provenance-tension fields in one document (complete_provenance 0 alongside provenance_complete true; a mode string naming missing_provenance; absolute machine-specific artifact paths). Status: recorded as internal tension, not adjudicated (scope differences between the fields are possible but unevidenced)."
    - "E4 (new): certification_certificate.json is self-referential (a certificate certifying certificates, authority self-named, no external anchor found in this pass). Status: recorded as structural observation; circularity not proven (an external anchor may exist unexamined), but none was found."


