## Stage 6 Status
- STATUS: COMPLETE — DELIBERATE STOP — AUTHORITY AMBIGUITY
- SCOPE: EXACTLY the Council-authorized gate item 17 (certificate state /
  authority): evidence can PROPOSE certificate state; only the EXISTING
  certificate authority can ESTABLISH authoritative certificate state. The
  bridge turns verified forward-provenance evidence into a DETERMINISTIC
  certificate candidate and evaluates it against the existing authority
  WITHOUT creating, replacing, or bypassing one. All work inside
  forward_provenance/ (the authoring area). No production/constitutional/
  Council/runtime state modified; no certificate history touched; no commits.
- NEW MODULE: TiannaraOS.Provenance.CertificateAuthorityBridge — PURE,
  deterministic (candidate_id via
  Canon.sha256(%{"candidate_id_spec" => @candidate_spec, "spine" => spine})).
  It consumes the Stage-1..5 substrate (Canon, IdentityAuthority, MetricLineage)
  WITHOUT modifying any of them and NEVER calls/imports the existing
  TiannaraOS.Provenance.Certificate module: the discovered authority's issuer
  is represented as a plain string (TiannaraOS.Provenance.Certificate.issue/1
  envelope generator), and the bridge builds bindings metadata only inside the
  unreachable issue_via_existing_authority/2 path.
- DISCOVERED AUTHORITY (recon, A01..A12): the existing certificate authority is
  TiannaraOS.Provenance.Certificate.issue/1 — a PURE, STATELESS envelope
  generator. There is NO certificate ledger, NO lifecycle, NO revocation, NO
  authorization policy, and NO gate. The authoritative Verifier.verify/1 checks
  only envelope binding + the certificate_certifies_metric edge (declared
  lineage), never decision/state semantics. Two COMPETING certificate stacks
  exist (root TiannaraOS + tiannara_runtime private stack) -> authority policy
  missing, transitions ambiguous, revocation undefined. These recon findings
  are the basis for the STOP.
- VERDICT CLOSURE (12 authority entries, authority_map/0): every A01..A12 entry
  is REBOUND/CLOSED: authority predicate undefined -> BLOCKED with a typed
  reason (e.g. authority_undiscovered, policy_missing, lifecycle_undefined,
  revocation_undefined); authorized_issuance? is CONSTANT false;
  certificate_issuable constant "NO_AUTHORITY_POLICY". transition/3 is
  SAFE-BLOCKED: returns {:blocked, decision} (decision ideal = decision, so a
  strict no-op for any external caller). The {:issued, ...} branch is
  UNREACHABLE under existing authority (authorized_issuance? == false), invoked
  only as documentation of what a realization WOULD call.
- PRECONDITIONS (PC-01..13): valid evidence (lineage ACCEPT or NOT CERTIFIABLE
  is still verified provenance -> flows through preconditions as blocked-at-
  PC-05; verdict UNVERIFIED/REJECT is blocked before candidate derivation with
  unverified_bundle reason); missing_execution / missing source / missing
  contract / provenance not verified / not certifiable / tampered bundle /
  called business / no root entity / undefined status / negative bools each
  produce distinct block reasons. failed terminals -> PC-05 NOT_CERTIFIABLE.
- §17 STOP CONDITIONS FIRED (documented, DO NOT PATCH): (1) authority policy
  missing across the boundary -> comparable certificates to the same subject
  cannot be bound; (2) lifecycle/revocation undefined -> a revoked-certificate
  contrast case cannot be represented; (3) competing authority stacks in root
  vs tiannara_runtime -> ambiguity. Every one of these BLOCKS; NONE is patched;
  certification is PROVABLY IMPOSSIBLE in Stage 6 (inverse safety property:
  with no certifiable transitions, no certificate can be issued, so no
  unauthorized/incorrect certificate can leak).

