============================================================
PURPOSE
============================================================
header: >
  Determine empirically whether Tiannara produces measurably better,
  calibrated, reproducible, evidence-grounded forecasts than appropriate
  baselines — OUT OF SAMPLE — and can determine WHEN prediction is
  unreliable or impossible. This is an audit, not a demonstration.
primary_question: >
  Can Tiannara use signals, mathematical reasoning, historical evidence,
  uncertainty estimation, competing models and feedback from previous
  forecasts to produce progressively better calibrated predictions?
secondary_question: >
  Can Tiannara correctly determine when prediction is unreliable or
  impossible? (Mandatory. A system that confidently predicts everything
  is inferior to one that identifies predictable and unpredictable regimes.)
null_hypothesis: >
  Tiannara's forecasts contain no predictive information beyond the
  baselines defined in EFDI_FA_001_BASELINE_DEFINITIONS.yaml (B0-B4).
  The audit is designed to reject or fail-to-reject this hypothesis,
  never to assume its negation.

============================================================
BOUNDARIES (measurement-only, hard constraints)
============================================================
constraints:
  - name: no_live_forecast_yet
    rule: >
      No forecast is issued until the full harness artifact set below is
      frozen AND this contract's pass conditions are recorded as met in
      EFDI_FA_001_STOP_REPORT.md.
  - name: measurement_only
    rule: >
      EFDI-FA-001 is a sensor experiment. No trade execution, no financial
      orders, no autonomous intervention, no external mutation. Forecasts
      are observations about external reality; they never command a system.
  - name: immutability
    rule: >
      A forecast is IMMUTABLE once issued. Outcomes and scores are appended
      after resolution. No forecast, probability, interval, or reason may
      ever be edited retroactively. Violations classify the series as
      contaminated and restart the relevant batch.
  - name: data_cutoff
    rule: >
      Every forecast records its data_cutoff. No information dated after
      data_cutoff may influence the forecast. (EFDI_FA_001_DATA_CUTOFF_PROTOCOL.md)
  - name: resolution_prefixed
    rule: >
      The resolution source and rule are fixed BEFORE the forecast is
      issued, never after, never reinterpreted at outcome time.
      (EFDI_FA_001_REAL_WORLD_RESOLUTION_PROTOCOL.md)
  - name: council_gated
    rule: >
      Each phase (pilot / calibration batch / empirical benchmark) requires
      explicit Council authorization. The harness itself is Council-authorized
      now; the FIRST live forecast requires a separate go decision.
  - name: no_source_mutation
    rule: >
      No modification to efdi.md, to EFDI D-series contracts or code, to
      governance records, or to the forward_provenance gate artifacts.

