============================================================
PHASE SEQUENCE (mandatory order)
============================================================
sequence:
  - PHASE_0_HARNESS: freeze contract, schema, ledger, metrics, baselines,
    cutoff rules, resolution rules, calibration rules, failure taxonomy,
    synthetic test matrix. Verify all PASS conditions below. HALT.
  - PHASE_1_SYNTHETIC: known-ground-truth tests (EFDI_FA_001_TEST_MATRIX.yaml)
    establish whether forecasts are calibrated on processes with KNOWN truth.
  - PHASE_2_PILOT: 10 live dual-domain forecasts (BTC 5m + Nairobi 60min).
    Purpose: verify the harness end-to-end. Not evidence of skill.
  - PHASE_3_CALIBRATION_BATCH: 100 live forecasts. First statistical assessment
    against B0-B4 under EFDI_FA_001_METRIC_SCHEMA.yaml significance rules.
  - PHASE_4_EMPIRICAL_BENCHMARK: 500+ live forecasts. Serious out-of-sample
    baseline comparison producing the horizon curve (5m/15m/1h/4h/24h/7d).
  - PHASE_5_SCORING: outcome resolution, calibration, baseline comparison.
  - PHASE_6_CERTIFICATION: verdict from the closed set (PASS /
    PASS_WITH_LIMITATIONS / PARTIAL / INSUFFICIENT_EVIDENCE / FAIL / BLOCKED).

