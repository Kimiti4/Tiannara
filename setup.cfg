[flake8]
max-line-length = 120
max-complexity = 10

# Exclude common directories
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .venv,
    venv,
    node_modules,
    .next,
    pytest-cache-files-*

# Ignore specific warnings (optional)
# E501: line too long (handled by max-line-length)
# E203: whitespace before ':' (conflicts with Black formatter)
# W503: line break before binary operator (conflicts with Black)
ignore = 
    E203,
    W503

# Enable bare except detection
# This enforces using `except Exception:` instead of bare `except:`
select = E, F, W, B9

# B9XX codes include:
# B901: Do not use bare except: (use except Exception:)
extend-select = 
    B9

# Per-file ignores (if needed)
# per-file-ignores = 
#     tiannara_core/some_file.py: E501
