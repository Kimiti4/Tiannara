# Tests RODF + RIPL resilience when morphic drift exceeds continuity floor
apiVersion: chaos-mesh.org/v1alpha1
kind: PhysicalChaos
metadata:
  name: rtl-identity-dissolution-test
  namespace: tiannara-phase8
spec:
  action: stress
  mode: all
  selector:
    namespaces: ["tiannara-phase8"]
    labelSelectors:
      app: tiannara-rtl
  stressngStressors: |
    --cpu 4 --cpu-load 95 --timeout 120s
    --vm 2 --vm-bytes 4G --timeout 120s
  duration: "3m"
  annotations:
    description: "Simulates high morphic drift + transcendence variance"
    expected_behavior: "RIPL enforces continuity preservation; KEDA scales up"
    validation_metrics:
      - "tiannara_phase8_rtl_identity_dissolution_rate < 0.90"
      - "tiannara_phase8_rtl_xi_equilibrium > 0.35"
      - "Pod replica count scales to ≥ 6 within 60s"