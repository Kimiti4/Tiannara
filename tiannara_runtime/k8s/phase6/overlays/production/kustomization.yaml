apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

patches:
- target:
    kind: Deployment
    name: tiannara-runtime
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 5
- target:
    kind: StatefulSet
    name: nats-cluster
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 5

configMapGenerator:
- name: runtime-config
  literals:
  - STABILITY_MODE=production
  - LOG_LEVEL=info
  - METRICS_EXPORT_INTERVAL=15s
  - SELF_COMPILATION_INTERVAL=300s
  - OBSERVER_RECURSION_LIMIT=4
  - SEMANTIC_DRIFT_THRESHOLD=0.35

secretGenerator:
- name: tiannara-secrets
  # Values are read from the build environment at deploy time; no secret value
  # is stored in this repository. The build fails closed when a variable is
  # unset. Keys match the secretKeyRef keys consumed by the base deployment.
  # Rotation procedure: certification/atlas/ops/OP-01_CREDENTIAL_ROTATION.md
  env:
  - release-cookie
  - nats-auth-token
  options:
    disableNameSuffixHash: true
