apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: phase17-ucc-scaling, namespace: tiannara-phase17}
spec:
  scaleTargetRef: {name: tiannara-ucc}
  pollingInterval: 10
  cooldownPeriod: 150
  minReplicaCount: 2
  maxReplicaCount: 16
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      threshold: "50"
      query: sum(rate(ucc_compilations_total[5m]))
      metricName: ucc_throughput
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
      threshold: "0.70"
      query: 1.0 - avg(ucc_equivalence_score) by (pod)
      metricName: ucc_equivalence_deficit