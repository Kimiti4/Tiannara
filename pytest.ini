[pytest]
testpaths = tiannara_core/nlp/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=tiannara_core.nlp
    --cov-report=term-missing
    --cov-report=html:coverage_reports/nlp
    --junitxml=test_results/nlp_test_results.xml

markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    slow: Slow running tests
