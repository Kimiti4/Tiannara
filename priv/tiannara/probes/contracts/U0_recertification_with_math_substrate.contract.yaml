  R21: "Complete causal trace reconstructible"
  R22: "No production mutation"
  R23: "Pollution check clean"

# Certification bounds (POL-CERT-AUTH-001)
production_mutation_allowed: false
registry_mutation_allowed: false
external_mutations_allowed: false
production_adoption_allowed: false
egress_mode: "dry_run"
canonical_topology_attach_allowed: true
isolated_test_namespace_allowed: true
no_pollution_required: true

verdict_space: [CERTIFIED, QUALIFIED_PARTIAL, NOT_CERTIFIED, BLOCKED]
verdict_rules:
  CERTIFIED: "all R1-R23 pass; math demonstrated as cross-subsystem substrate"
  QUALIFIED_PARTIAL: "loop holds but math integration conditional/limited"
  NOT_CERTIFIED: "math substrate cannot compose with organism loop"
  BLOCKED: "canonical path cannot be exercised without unauthorized mutation"

post_certification_claim: >
  On CERTIFIED: "Tiannara is not merely a unified system with a mathematics
  capability; its mathematical substrate participates causally in perception →
  knowledge → reasoning → governance → executive delegation → adaptation →
  homeostasis → continuity."

