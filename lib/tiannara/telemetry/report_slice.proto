syntax = "proto3";
package tiannara.report;

message ReportSlice {
  repeated uint64 epoch_range = 1;
  float avg_entropy = 2;
  float peak_pressure = 3;
  uint32 mutation_count = 4;
  repeated Coordinate sample_coordinates = 5;
}

message Coordinate {
  uint64 id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float pressure = 5;
  float entropy = 6;
}
