name: Tiannara Final Product Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/final-product-closure]

permissions:
  contents: read

jobs:
  python:
    name: Python API/Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q tiannara_api tiannara_core
      - run: pytest -q
        continue-on-error: true
      - run: python scripts/final_product_audit.py --base-url http://127.0.0.1:8000
        continue-on-error: true

  saas:
    name: SaaS Typecheck and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiannara_saas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: tiannara_saas/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  observatory_ui:
    name: Observatory UI Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiannara_observatory/apps/observatory_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: tiannara_observatory/apps/observatory_ui/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  elixir:
    name: Tiannara Elixir Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "28.0"
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
