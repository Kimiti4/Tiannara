name: Elixir CI

# Guards the Elixir constitutional core.
#
# Before this workflow, no job on any branch compiled or tested the Elixir app:
# test.yml is Python-only, ci-cd.yml has no BEAM step, and the two workflows that
# do install Elixir cover narrow scopes. A branch therefore reached review with
# top-level syntax errors that made the whole application fail to compile, and
# with a *_test.exs file under lib/ that `mix test` never discovers.
#
# Blocking jobs are limited to what is currently green (compilation, test
# placement). Suite health and test hermeticity are reported as advisory because
# they are known-debt; see the TODOs before promoting them to blocking.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Matches the version the suite was validated against locally (Mix 1.18.4 / OTP 28).
  # Pinned explicitly: this repo has no .tool-versions file.
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"

jobs:
  compile:
    name: Compile (errors fatal)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # --force so a warm cache cannot mask a broken source file.
      - run: mix compile --force --color

      # Dynamic calls (GenServer.call, apply/3) type-check clean but raise at
      # runtime, so compilation alone cannot prove an API exists.
      - name: Runtime import smoke check
        env:
          MIX_ENV: test
        run: mix run -e ":ok"

  misfiled-tests:
    name: Test placement guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Detection is AST-based on purpose. The first version of this job used
      # `find lib -name '*_test.ex*'`, which on this repository was wrong in
      # both directions at once - measured over all 1,646 lib/**/*.ex sources:
      #
      #   * FALSE POSITIVE: lib/tiannara/crav/soak_test.ex is
      #     Tiannara.CRAV.SoakTest, a GenServer soak driver called from
      #     web/crav_challenge_controller.ex, crav/alpha_launch.ex and
      #     asc/agency/sentinel.ex. Its tests already live correctly in
      #     test/tiannara/crav/soak_test_test.exs. Acting on that report would
      #     have moved production code out of lib/ and broken four callers.
      #   * FALSE NEGATIVE: lib/tiannara/omega/human_delivery/explanation.ex
      #     declares Tiannara.Omega.HumanDelivery.ExplanationTest with
      #     `use ExUnit.Case`, and nothing under test/ covers that module. That
      #     test has never been executed by any CI run or any `mix test`.
      #
      # Grepping for `use ExUnit.Case` is also insufficient: that exact text
      # appears inside code-generation heredocs in
      # lib/tiannara/tool_forge/tool_builder.ex and
      # lib/tiannara/asc/implementation/adapter/elixir.ex. A string literal is
      # not a call, so parsing removes both error classes. Files that fail to
      # parse are treated as failures rather than silently skipped, because the
      # compile job has already accepted them.
      - name: Fail if any lib/ module declares an ExUnit test case
        run: |
          set -euo pipefail
          cat > /tmp/misfiled_check.exs <<'ELIXIR'
          defmodule MisfiledCheck do
            @styles [[:ExUnit, :Case], [:ExUnit, :AsyncCase], [:ExUnit, :DataCase]]

            def test_module?(ast) do
              {_, found} =
                Macro.prewalk(ast, false, fn
                  {:use, _, [{:__aliases__, _, mods} | _]} = node, acc ->
                    if Enum.member?(@styles, mods) do
                      {node, true}
                    else
                      {node, acc}
                    end

                  other, acc ->
                    {other, acc}
                end)

              found
            end
          end

          root = System.argv() |> List.first() || "lib"

          {scanned, misfiled, unparsed} =
            Path.wildcard(Path.join(root, "**/*.ex"))
            |> Enum.reduce({0, [], []}, fn file, {n, bad, unparsed} ->
              case Code.string_to_quoted(File.read!(file)) do
                {:ok, ast} ->
                  if MisfiledCheck.test_module?(ast) do
                    {n + 1, [file | bad], unparsed}
                  else
                    {n + 1, bad, unparsed}
                  end

                {:error, where} ->
                  {n + 1, bad, [{file, where} | unparsed]}
              end
            end)

          IO.puts("scanned #{scanned} sources under #{root}/")

          # Non-vacuity: a scan that read nothing proves nothing. Observed in
          # local testing when a wrong root produced "scanned 0 sources" and
          # exited 0, which would have turned this gate green by accident.
          if scanned == 0 do
            IO.puts(:stderr, "::error::no .ex sources found under #{root}/: the check saw nothing and cannot pass")
            System.halt(1)
          end

          if unparsed != [] do
            IO.puts(:stderr, "::error::unparseable sources under #{root}/: cannot classify, failing closed")

            Enum.each(Enum.sort(unparsed), fn {f, where} ->
              IO.puts(:stderr, "  #{f} #{inspect(where)}")
            end)
          end

          if misfiled != [] do
            IO.puts(:stderr, "::error::ExUnit test modules under #{root}/ are never executed by mix test (test_paths is [\"test\"])")

            Enum.each(Enum.sort(misfiled), fn f ->
              IO.puts(:stderr, "  #{f}")
            end)

            System.halt(1)
          end

          if unparsed != [] do
            System.halt(1)
          end
          ELIXIR
          elixir /tmp/misfiled_check.exs lib

      # Advisory only. A module whose name ends in Test while living under lib/
      # is confusing - Tiannara.CRAV.SoakTest is exactly that - but naming is
      # not a correctness defect, so it is reported instead of enforced.
      - name: Report Test-shaped filenames under lib/
        continue-on-error: true
        run: |
          set -uo pipefail
          hits="$(find lib \( -name '*_test.ex' -o -name '*_test.exs' \) -print || true)"
          if [ -n "$hits" ]; then
            echo "::warning::Test-shaped filenames under lib/ confuse readers and tooling; consider renaming if they are production code."
            echo "$hits"
          else
            echo "No Test-shaped filenames under lib/."
          fi

  suite:
    name: Suite signal (advisory)
    runs-on: ubuntu-latest
    needs: [compile, misfiled-tests]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # ADVISORY: the suite is not yet green and is order-dependent, so a blocking
      # gate here would be ignored rather than acted on.
      # TODO: promote to blocking once the suite is hermetic and order-independent.
      - name: mix test
        continue-on-error: true
        env:
          MIX_ENV: test
        run: mix test --max-failures 25 --color

      # Running the suite currently rewrites tracked canonical artifacts
      # (council_audit_log.dets, cel_event_store.dets, data/orbit_*), which means
      # test execution mutates evidence. Reported, not enforced.
      # TODO: make blocking once tests use a sandboxed data path.
      - name: Hermeticity report
        continue-on-error: true
        run: |
          set -uo pipefail
          dirty="$(git status --porcelain -- '*.dets' 'data/' 'priv/static/data/' || true)"
          if [ -n "$dirty" ]; then
            echo "::warning::mix test mutated tracked canonical artifacts; the suite is not hermetic."
            echo "$dirty"
          else
            echo "Suite left tracked artifacts untouched."
          fi

  ignore-hygiene:
    name: Ignore hygiene (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # A path matched by an ignore rule is invisible to `git status` and is
      # skipped by `git add`, so anything new created under it can only be
      # committed with `git add -f`. Whole classes of correctness work therefore
      # become silently uncommittable, and neither reviewer nor CI learns they
      # exist. Reproduced on a developer host on 2026-09-29: freshly created
      # test/zz_probe_test.exs and .github/zz_probe.yml were absent from both
      # `git status` and `git add -A --dry-run`.
      #
      # This probes behaviour rather than grepping ignore files: the hazard is
      # what a rule does to a new file, not how the rule is spelled. It also
      # cannot be satisfied by editing a comment.
      - name: Correctness-critical paths must be visible to git
        run: |
          set -uo pipefail
          failed=0

          report() {
            printf '::error file=.gitignore,title=Ignore hygiene::%s\n' "$1"
            failed=1
          }

          # 1. Directories that must never be ignored.
          for dir in test tests .github; do
            if [ ! -d "$dir" ]; then
              report "expected directory '$dir' is missing from the checkout"
              continue
            fi
            if rule=$(git check-ignore --no-index --verbose "$dir" 2>/dev/null); then
              report "'$dir' is ignored ($rule), so new files there need git add -f"
            fi
          done

          # 2. End-to-end proof: a brand new test and workflow must be addable.
          mkdir -p test/tiannara .github/workflows
          probe_test=test/tiannara/zz_ignore_hygiene_probe_test.exs
          probe_wf=.github/workflows/zz_ignore_hygiene_probe.yml
          printf 'defmodule ZzIgnoreHygieneProbe do\nend\n' > "$probe_test"
          printf 'name: ZzIgnoreHygieneProbe\n' > "$probe_wf"
          for probe in "$probe_test" "$probe_wf"; do
            if rule=$(git check-ignore --no-index --verbose "$probe" 2>/dev/null); then
              report "'$probe' is ignored ($rule)"
            elif ! git add --dry-run -- "$probe" >/dev/null 2>&1; then
              report "'$probe' is not addable by git add without -f"
            fi
          done
          rm -f "$probe_test" "$probe_wf"

          # 3. The ignore policy must itself be versioned, or the rules that hide
          #    tests escape review.
          for policy in .gitignore .gitattributes; do
            if [ -e "$policy" ] && ! git ls-files --error-unmatch "$policy" >/dev/null 2>&1; then
              report "'$policy' exists but is not tracked"
            fi
          done

          if [ "$failed" -eq 0 ]; then
            echo "test/, tests/, .github/ and newly created test/workflow files are visible to git."
          fi
          exit "$failed"
