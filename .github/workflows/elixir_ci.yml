name: Elixir CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix compile --force --color
      - env:
          MIX_ENV: test
        run: mix run -e ":ok"
  test-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Fail closed on ExUnit modules under lib/
        run: |
          set -euo pipefail
          files=$(find lib -type f -name '*.ex')
          test -n "$files"
          for file in $files; do
            # These files contain source templates that generate tests; they are not ExUnit modules themselves.
            case "$file" in
              lib/tiannara/tool_forge/tool_builder.ex|lib/tiannara/asc/implementation/adapter/elixir.ex) continue ;;
            esac
            if grep -Eq '^[[:space:]]*use[[:space:]]+ExUnit\.(Case|AsyncCase|DataCase)' "$file"; then
              echo "::error::ExUnit test module found under lib/: $file"
              exit 1
            fi
          done
  lineage-regression:
    runs-on: ubuntu-latest
    needs: [compile, test-placement]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - env:
          MIX_ENV: test
        run: mix test test/tiannara/discovery/discovery_lineage_test.exs --color
  suite:
    runs-on: ubuntu-latest
    needs: [compile, test-placement]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - env:
          MIX_ENV: test
        run: mix test --max-failures 25 --color
  # CI-suite widening (operator plan, steps 2-3): the tiannara_runtime
  # project's test suite was never executed by any workflow on this
  # branch (the root `suite` job above is a different mix project, and
  # phase_5f2_tests.yml only triggers on main/develop). Required gate:
  # full suite with the quarantined tests excluded; a test or compile
  # failure fails this job (nonzero exit), so green here means the
  # required tests truly ran.
  tiannara-runtime-suite:
    name: tiannara_runtime suite (required)
    runs-on: ubuntu-latest
    needs: [compile, test-placement]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            tiannara_runtime/deps
            tiannara_runtime/_build
          key: ${{ runner.os }}-mix-tr-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('tiannara_runtime/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-tr-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
        working-directory: tiannara_runtime
      - name: Run tiannara_runtime suite (quarantine excluded)
        env:
          MIX_ENV: test
        run: mix test --exclude quarantine --color
        working-directory: tiannara_runtime
  # Intentionally non-blocking (visible, separate): executes ONLY the
  # quarantined tests so their status stays observable without gating
  # the required suite. Quarantine inventory: certification/audit/
  # TIANNARA_RUNTIME_TEST_INVENTORY.md.
  tiannara-runtime-quarantine:
    name: tiannara_runtime quarantine (non-blocking)
    runs-on: ubuntu-latest
    needs: [compile, test-placement]
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            tiannara_runtime/deps
            tiannara_runtime/_build
          key: ${{ runner.os }}-mix-tr-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('tiannara_runtime/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-tr-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
        working-directory: tiannara_runtime
      - name: Run quarantined tests (informational)
        env:
          MIX_ENV: test
        run: mix test --only quarantine --color
        working-directory: tiannara_runtime
  # The independent audit tool (tiannara_audit) had no test suite and no CI
  # job at all (F-GOV-011), while the reports it produced - the tracked
  # "220 / 220 PASS" audit report - were cited as evidence elsewhere. Two of
  # its verifiers could not fail (F-ARC-007). This job runs the fail-closed
  # verifier suite, so a verifier that can no longer fail is detected here
  # rather than by a consumer of a stale report.
  tiannara-audit-suite:
    name: tiannara_audit suite (required)
    runs-on: ubuntu-latest
    needs: [compile, test-placement]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            tiannara_audit/deps
            tiannara_audit/_build
          key: ${{ runner.os }}-mix-audit-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('tiannara_audit/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-audit-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
        working-directory: tiannara_audit
      - name: Run tiannara_audit verifier suite
        env:
          MIX_ENV: test
        run: mix test --color
        working-directory: tiannara_audit
