name: Elixir CI

# Guards the Elixir constitutional core.
#
# Before this workflow, no job on any branch compiled or tested the Elixir app:
# test.yml is Python-only, ci-cd.yml has no BEAM step, and the two workflows that
# do install Elixir cover narrow scopes. A branch therefore reached review with
# top-level syntax errors that made the whole application fail to compile, and
# with a *_test.exs file under lib/ that `mix test` never discovers.
#
# Blocking jobs are limited to what is currently green (compilation, test
# placement). Suite health and test hermeticity are reported as advisory because
# they are known-debt; see the TODOs before promoting them to blocking.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Matches the version the suite was validated against locally (Mix 1.18.4 / OTP 28).
  # Pinned explicitly: this repo has no .tool-versions file.
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"

jobs:
  compile:
    name: Compile (errors fatal)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # --force so a warm cache cannot mask a broken source file.
      - run: mix compile --force --color

      # Dynamic calls (GenServer.call, apply/3) type-check clean but raise at
      # runtime, so compilation alone cannot prove an API exists.
      - name: Runtime import smoke check
        env:
          MIX_ENV: test
        run: mix run -e ":ok"

  misfiled-tests:
    name: Test placement guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any test file lives under lib/
        run: |
          set -euo pipefail
          matches="$(find lib \( -name '*_test.exs' -o -name '*_test.ex' \) -print || true)"
          if [ -n "$matches" ]; then
            echo "::error::Test files under lib/ are never executed by mix test."
            echo "$matches"
            exit 1
          fi
          echo "No misfiled test sources."

  suite:
    name: Suite signal (advisory)
    runs-on: ubuntu-latest
    needs: [compile, misfiled-tests]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get

      # ADVISORY: the suite is not yet green and is order-dependent, so a blocking
      # gate here would be ignored rather than acted on.
      # TODO: promote to blocking once the suite is hermetic and order-independent.
      - name: mix test
        continue-on-error: true
        env:
          MIX_ENV: test
        run: mix test --max-failures 25 --color

      # Running the suite currently rewrites tracked canonical artifacts
      # (council_audit_log.dets, cel_event_store.dets, data/orbit_*), which means
      # test execution mutates evidence. Reported, not enforced.
      # TODO: make blocking once tests use a sandboxed data path.
      - name: Hermeticity report
        continue-on-error: true
        run: |
          set -uo pipefail
          dirty="$(git status --porcelain -- '*.dets' 'data/' 'priv/static/data/' || true)"
          if [ -n "$dirty" ]; then
            echo "::warning::mix test mutated tracked canonical artifacts; the suite is not hermetic."
            echo "$dirty"
          else
            echo "Suite left tracked artifacts untouched."
          fi
