name: Elixir CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - run: mix compile --force --color
      - env:
          MIX_ENV: test
        run: mix run -e ":ok"
  test-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Fail closed on ExUnit modules under lib/
        run: |
          set -euo pipefail
          files=$(find lib -type f -name '*.ex')
          test -n "$files"
          for file in $files; do
            if grep -Eq '^[[:space:]]*use[[:space:]]+ExUnit\.(Case|AsyncCase|DataCase)' "$file"; then
              echo "::error::ExUnit test module found under lib/: $file"
              exit 1
            fi
          done
  lineage-regression:
    runs-on: ubuntu-latest
    needs: [compile, test-placement]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - env:
          MIX_ENV: test
        run: mix test test/tiannara/discoveries/promotion_gate_test.exs test/tiannara/os/discovery_registry_test.exs test/tiannara/os/discovery_registry_promotion_fail_closed_test.exs test/tiannara/epistemic_promotion_integration_test.exs --color
  suite:
    runs-on: ubuntu-latest
    needs: [compile, test-placement]
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-
      - run: mix deps.get
      - env:
          MIX_ENV: test
        run: mix test --max-failures 25 --color
