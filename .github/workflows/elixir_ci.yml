name: Elixir CI

# Canonical BEAM test gate for Tiannara.
# The legacy test.yml is Python-only and ci-cd.yml does not compile the Elixir
# application. This workflow makes the Elixir tree visible to CI and runs on
# every branch push, pull request, and manual dispatch.

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"

jobs:
  compile:
    name: Elixir compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile from a clean build
        run: mix compile --force --color

      - name: Runtime import smoke check
        env:
          MIX_ENV: test
        run: mix run -e ":ok"

  test-placement:
    name: Test placement guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Fail closed on ExUnit modules under lib/
        run: |
          set -euo pipefail
          cat > /tmp/check_test_placement.exs <<'ELIXIR'
          defmodule TestPlacement do
            def test_module?(ast) do
              {_ast, found} =
                Macro.prewalk(ast, false, fn
                  {:use, _, [{:__aliases__, _, [:ExUnit, module]} | _]} = node, acc
                  when module in [:Case, :AsyncCase, :DataCase] ->
                    {node, true}

                  node, acc ->
                    {node, acc}
                end)

              found
            end
          end

          files = Path.wildcard("lib/**/*.ex")
          if files == [], do: System.halt(1)

          {bad, parse_errors} =
            Enum.reduce(files, {[], []}, fn file, {bad, errors} ->
              case Code.string_to_quoted(File.read!(file)) do
                {:ok, ast} ->
                  if TestPlacement.test_module?(ast), do: {[file | bad], errors}, else: {bad, errors}

                {:error, error} ->
                  {bad, [{file, error} | errors]}
              end
            end)

          if parse_errors != [] do
            IO.puts(:stderr, "::error::Unable to parse one or more lib/ sources")
            Enum.each(parse_errors, fn {file, error} -> IO.puts(:stderr, "#{file}: #{inspect(error)}") end)
            System.halt(1)
          end

          if bad != [] do
            IO.puts(:stderr, "::error::ExUnit test modules found under lib/")
            Enum.each(Enum.sort(bad), &IO.puts/1)
            System.halt(1)
          end

          IO.puts("Test placement guard passed: #{length(files)} lib/ sources scanned.")
          ELIXIR
          elixir /tmp/check_test_placement.exs

  lineage-regression:
    name: Discovery lineage regression
    runs-on: ubuntu-latest
    needs: [compile, test-placement]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get

      - name: Run lineage regression tests
        env:
          MIX_ENV: test
        run: mix test test/tiannara/os/discovery_registry_lineage_test.exs --color

  suite:
    name: Full ExUnit suite (advisory)
    runs-on: ubuntu-latest
    needs: [compile, test-placement]
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get

      - name: Run full suite
        env:
          MIX_ENV: test
        run: mix test --max-failures 25 --color

      - name: Report tracked-artifact mutation
        if: always()
        run: |
          dirty="$(git status --porcelain -- '*.dets' 'data/' 'priv/static/data/' || true)"
          if [ -n "$dirty" ]; then
            echo "::warning::Full test suite mutated tracked runtime/evidence artifacts:"
            echo "$dirty"
          else
            echo "No tracked runtime/evidence artifacts were mutated."
          fi
